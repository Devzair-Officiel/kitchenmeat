server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css application/javascript application/json font/woff font/woff2 image/svg+xml;
    gzip_min_length 1024;

    # Cache statique long pour les assets versionnés (_nuxt/)
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache moyen pour images et fonts
    location ~* \.(webp|woff2?|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
